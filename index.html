<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in Invités</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid #ddd;background:#fff;position:sticky;top:0;z-index:5}
.logo{color:#ff385c;font-weight:800;font-size:21px}
.hero{height:220px;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url(https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1600&q=70) center/cover}
main{max-width:780px;margin:-48px auto 48px;padding:0 16px}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:22px;margin-bottom:18px}
.ban{background:#222;color:#fff;border-radius:14px;padding:13px 16px;margin-bottom:18px;font-size:14px;border-left:6px solid #ff385c}
input,select,textarea{width:100%;padding:13px;border:1px solid #8a8a8a;border-radius:12px;font:inherit;margin:4px 0 12px;background:#fff;color:#222}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #222;outline-offset:1px}
button{background:#ff385c;color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
button.s{background:#fff;color:#222;border:1px solid #222}
canvas{width:100%;height:160px;border:1px solid #8a8a8a;border-radius:12px;touch-action:none;display:block;margin-bottom:6px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid #ddd}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.g{grid-template-columns:1fr}.hero{height:160px}}
small{color:#5e5e5e}
a{color:#d70466}
h2{margin:0 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
const FB={apiKey:"",authDomain:"",databaseURL:"",projectId:"",appId:""};
const EJ={pub:"",service:"",tpl:""};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.database();
if(EJ.pub)emailjs.init({publicKey:EJ.pub});
const $=s=>document.querySelector(s),app=$("#app"),H48=48*36e5;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let L=localStorage.l||"fr",U,A={},G={},A1,GU,GR,SG=0,GID,OFF,WA=0;
const T={
fr:{app:"Check-in Invités",login:"Connexion",signup:"Créer un compte",email:"E-mail",pass:"Mot de passe",forgot:"Mot de passe oublié ?",sent:"E-mail de réinitialisation envoyé",logout:"Déconnexion",apt:"Appartement",name:"Nom",addr:"Adresse",wifi:"Wi-Fi (nom + code)",guide:"Guide du logement",door:"Liens d'ouverture de porte (un par ligne)",save:"Enregistrer",gl:"Lien d'enregistrement",el:"Lien dépenses",mkexp:"Créer le lien dépenses",count:"Nombre de personnes",guests:"Invités enregistrés",none:"Aucun invité",ban:"Données supprimées automatiquement après 48 h. Envoyez ce PDF par WhatsApp pour le télécharger avant son expiration.",cons:"J'accepte que mes données soient conservées 48 heures puis supprimées.",fiche:"Fiche d'enregistrement",rules:"Règlement intérieur",fn:"Nom complet",nat:"Nationalité",doc:"N° pièce d'identité / passeport",tel:"Téléphone",in:"Arrivée",out:"Départ",sign:"Signature",clear:"Effacer",send:"Envoyer",thanks:"Merci ! Votre enregistrement est envoyé.",req:"Champs, signature et consentement obligatoires",members:"Participants",exp:"Dépenses",desc:"Libellé",amt:"Montant",add:"Ajouter",bal:"Soldes",total:"Total",s1:"Votre compte",s2:"Votre appartement",s3:"Bâtiment",s4:"Wi-Fi",s5:"Guide du logement",s6:"Ouverture de porte",city:"Ville",bld:"Nom du bâtiment",floor:"Étage",code:"Code d'entrée",num:"N° d'appartement",wifin:"Nom du Wi-Fi",wific:"Code Wi-Fi",phone:"Téléphone du gestionnaire",next:"Suivant",back:"Retour",finish:"Terminer",req2:"Tous les champs sont obligatoires",pass6:"Mot de passe : 6 caractères minimum"},
en:{app:"Guest Check-in",login:"Log in",signup:"Create account",email:"Email",pass:"Password",forgot:"Forgot password?",sent:"Reset email sent",logout:"Log out",apt:"Apartment",name:"Name",addr:"Address",wifi:"Wi-Fi (name + code)",guide:"Home guide",door:"Door opening links (one per line)",save:"Save",gl:"Check-in link",el:"Expenses link",mkexp:"Create expenses link",count:"Number of people",guests:"Registered guests",none:"No guests",ban:"Data is automatically deleted after 48 h. Send this PDF via WhatsApp to download it before it expires.",cons:"I agree my data is kept for 48 hours, then deleted.",fiche:"Registration form",rules:"House Rules",fn:"Full name",nat:"Nationality",doc:"ID / passport number",tel:"Phone",in:"Arrival",out:"Departure",sign:"Signature",clear:"Clear",send:"Submit",thanks:"Thank you! Your registration is sent.",req:"Fields, signature and consent are required",members:"Participants",exp:"Expenses",desc:"Label",amt:"Amount",add:"Add",bal:"Balances",total:"Total",s1:"Your account",s2:"Your apartment",s3:"Building",s4:"Wi-Fi",s5:"Home guide",s6:"Door opening",city:"City",bld:"Building name",floor:"Floor",code:"Entrance code",num:"Apartment no.",wifin:"Wi-Fi name",wific:"Wi-Fi code",phone:"Manager phone",next:"Next",back:"Back",finish:"Finish",req2:"All fields are required",pass6:"Password: 6 characters minimum"},
ar:{app:"تسجيل الضيوف",ban:"تُحذف البيانات تلقائياً بعد 48 ساعة. أرسل ملف PDF عبر واتساب لتحميله قبل انتهاء صلاحيته.",cons:"أوافق على الاحتفاظ ببياناتي لمدة 48 ساعة ثم حذفها.",fn:"الاسم الكامل",nat:"الجنسية",doc:"رقم الهوية / جواز السفر",tel:"الهاتف",in:"الوصول",out:"المغادرة",sign:"التوقيع",clear:"مسح",send:"إرسال",thanks:"شكراً! تم إرسال تسجيلك.",req:"الحقول والتوقيع والموافقة إجبارية"}
};
const t=k=>(T[L]||{})[k]||T.fr[k];
const tp=k=>(T[L=="ar"?"en":L]||{})[k]||T.fr[k];
function shell(h){
app.innerHTML=`<header><span class="logo">⌂ ${t("app")}</span><select style="width:auto;margin:0" onchange="L=this.value;localStorage.l=L;route()">${["fr","en","ar"].map(x=>`<option ${x==L?"selected":""}>${x}</option>`).join("")}</select></header><div class="hero"></div><main>${h}</main>`;
document.documentElement.dir=L=="ar"?"rtl":"ltr";
}
let RT=0;
function route(){
if(OFF){OFF();OFF=0}
const my=++RT,h=location.hash.slice(1).split("/");
if(h[1]=="g")guest(h[2],h[3],my);else if(h[1]=="t")trip(h[2]);else owner();
}
addEventListener("hashchange",route);
auth.onAuthStateChanged(()=>{if(!/^#\/[gt]\//.test(location.hash))route()});
if(/^#\/[gt]\//.test(location.hash))route();
function authView(){
WA=0;shell(`<div class="card"><h2>${t("app")}</h2><input id="e" type="email" placeholder="${t("email")}"><input id="p" type="password" placeholder="${t("pass")}"><button onclick="doAuth('in')">${t("login")}</button><button class="s" onclick="wiz()">${t("signup")}</button><br><a href="#" onclick="reset();return false">${t("forgot")}</a></div>`);
}
const WS=[["s1",[["w_e","email","email"],["w_p","pass","password"]]],["s2",[["w_n","name","text"],["w_a","addr","text"],["w_c","city","text"]]],["s3",[["w_b","bld","text"],["w_f","floor","text"],["w_k","code","text"],["w_u","num","text"]]],["s4",[["w_wn","wifin","text"],["w_wc","wific","text"]]],["s5",[["w_g","guide","area"]]],["s6",[["w_d","door","area"],["w_t","phone","tel"]]]];
let WI=0,WD={};
function wiz(){
WA=1;
const s=WS[WI];
shell(`<div class="card"><small>${WI+1} / ${WS.length}</small><h2>${t(s[0])}</h2>${s[1].map(f=>`<label>${t(f[1])}${f[2]=="area"?`<textarea id="${f[0]}">${esc(WD[f[0]]||"")}</textarea>`:`<input id="${f[0]}" type="${f[2]}" value="${esc(WD[f[0]]||"")}">`}</label>`).join("")}${WI?`<button class="s" onclick="wBack()">${t("back")}</button>`:`<button class="s" onclick="authView()">${t("login")}</button>`}<button onclick="wNext()">${WI==WS.length-1?t("finish"):t("next")}</button></div>`);
}
function wRead(){WS[WI][1].forEach(f=>{WD[f[0]]=$("#"+f[0]).value.trim()})}
function wBack(){wRead();WI--;wiz()}
async function wNext(){
wRead();
if(WS[WI][1].some(f=>!WD[f[0]]))return alert(t("req2"));
if(WI==0&&WD.w_p.length<6)return alert(t("pass6"));
if(WI<WS.length-1){WI++;return wiz()}
try{
await auth.createUserWithEmailAndPassword(WD.w_e,WD.w_p);
U=auth.currentUser.uid;
await db.ref("apts/"+U).push({name:WD.w_n,addr:WD.w_a+", "+WD.w_c,email:WD.w_e,bld:WD.w_b,floor:WD.w_f,code:WD.w_k,num:WD.w_u,wifi:WD.w_wn+" / "+WD.w_wc,guide:WD.w_g,door:WD.w_d,tel:WD.w_t});
WD={};WI=0;WA=0;owner();
}catch(x){alert(x.message)}
}
async function doAuth(m){
const e=$("#e").value,p=$("#p").value;
try{m=="up"?await auth.createUserWithEmailAndPassword(e,p):await auth.signInWithEmailAndPassword(e,p)}catch(x){alert(x.message)}
}
async function reset(){
const e=$("#e").value;
if(!e)return alert(t("email"));
try{await auth.sendPasswordResetEmail(e);alert(t("sent"))}catch(x){alert(x.message)}
}
function cp(u){navigator.clipboard.writeText(u).then(()=>alert(u)).catch(()=>prompt("",u))}
async function owner(){
const u=auth.currentUser;
if(!u)return WA?wiz():authView();
U=u.uid;
const r=await Promise.all(["apts","guests","ogroups"].map(p=>db.ref(p+"/"+U).get()));
A=r[0].val()||{};G=r[1].val()||{};
const O=r[2].val()||{},now=Date.now(),base=location.origin+location.pathname;
for(const k in G)if(G[k].exp<now){db.ref(`guests/${U}/${k}`).remove();delete G[k]}
shell(`<div class="ban">${t("ban")}</div>
<div class="card"><h2>${t("apt")}</h2><div class="g"><div><input id="an" placeholder="${t("name")}"><input id="aa" placeholder="${t("addr")}"><input id="ae" type="email" placeholder="${t("email")}"></div><div><input id="aw" placeholder="${t("wifi")}"><textarea id="ag" placeholder="${t("guide")}"></textarea></div></div><textarea id="ad" placeholder="${t("door")}"></textarea><button onclick="addApt()">${t("save")}</button><button class="s" onclick="auth.signOut()">${t("logout")}</button></div>
${Object.entries(A).map(([k,v])=>`<div class="card"><b>${esc(v.name)}</b><br><small>${esc(v.addr)}</small><br><br><button onclick="cp('${base}#/g/${U}/${k}')">${t("gl")}</button>${O[k]?`<button class="s" onclick="cp('${base}#/t/${O[k]}')">${t("el")}</button>`:`<button class="s" onclick="mkGroup('${k}')">${t("mkexp")}</button>`}</div>`).join("")}
<div class="card"><h2>${t("guests")}</h2>${Object.entries(G).map(([k,v])=>`<p><b>${esc(v.name)}</b> — ${esc(v.aptName)}<br><small>${esc(v.in)} → ${esc(v.out)} (${Math.max(0,Math.round((v.exp-now)/36e5))} h)</small><br><button class="s" onclick="pdfG('${k}')">PDF</button><button onclick="shareG('${k}')">WhatsApp</button></p>`).join("")||t("none")}</div>`);
}
async function addApt(){
const v={name:$("#an").value.trim(),addr:$("#aa").value,email:$("#ae").value,wifi:$("#aw").value,guide:$("#ag").value,door:$("#ad").value};
if(!v.name)return;
await db.ref("apts/"+U).push(v);
owner();
}
async function mkGroup(k){
const n=prompt(t("name"),A[k].name);
if(!n)return;
const c=parseInt(prompt(t("count"),"2"))||2,r=db.ref("groups").push();
await r.set({name:n,members:Array.from({length:c},(_,i)=>"P"+(i+1))});
await db.ref(`ogroups/${U}/${k}`).set(r.key);
owner();
}
function pdfG(k){pdfF(G[k],A[G[k].apt]||{}).save("fiche.pdf")}
function shareG(k){shareDoc(pdfF(G[k],A[G[k].apt]||{}),"fiche.pdf")}
function head(d,title){
d.setFillColor(255,56,92);d.rect(0,0,210,18,"F");d.setTextColor(255);d.setFontSize(9);
d.text(d.splitTextToSize(tp("ban"),190),10,7);
d.setTextColor(34);d.setFontSize(18);d.text(title,15,32);d.setFontSize(11);
}
function pdfF(r,a){
const d=new jspdf.jsPDF();
head(d,tp("fiche"));
let y=46;
[[tp("apt"),a.name],[tp("fn"),r.name],[tp("nat"),r.nat],[tp("doc"),r.doc],[tp("tel"),r.tel],[tp("in"),r.in],[tp("out"),r.out]].forEach(x=>{d.text(`${x[0]}: ${x[1]||""}`,15,y);y+=9});
d.text(tp("sign"),15,y+6);
d.addImage(r.sig,"PNG",15,y+10,70,24);
return d;
}
function pdfR(a){
const d=new jspdf.jsPDF();
head(d,tp("rules"));
let y=46;
const w=(l,v)=>{d.setFont(undefined,"bold");d.text(l,15,y);d.setFont(undefined,"normal");y+=7;const s=d.splitTextToSize(v||"-",180);d.text(s,15,y);y+=s.length*6+6};
w(a.name||"",a.addr);w(tp("bld"),[a.bld,a.floor&&tp("floor")+" "+a.floor,a.code&&tp("code")+" "+a.code,a.num&&"#"+a.num].filter(Boolean).join(" · "));w(tp("wifi"),a.wifi);w(tp("guide"),a.guide);
d.setFont(undefined,"bold");d.text(tp("door"),15,y);y+=7;d.setFont(undefined,"normal");
(a.door||"").split("\n").filter(Boolean).forEach(u=>{d.setTextColor(215,4,102);d.textWithLink(u,15,y,{url:u});y+=7});
return d;
}
async function shareDoc(d,n){
const f=new File([d.output("blob")],n,{type:"application/pdf"});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{return await navigator.share({files:[f],text:tp("ban")})}catch(e){}}
d.save(n);
open("https://wa.me/?text="+encodeURIComponent(tp("ban")));
}
async function guest(uid,aid,my){
const s=await db.ref(`apts/${uid}/${aid}`).get();
if(my&&my!=RT)return;
if(!s.exists())return shell('<div class="card">404</div>');
A1=s.val();
if(GR&&GU&&GU[0]==uid&&GU[1]==aid)return thanks();
GU=[uid,aid];SG=0;
shell(`<div class="ban">${t("ban")}</div><div class="card"><h2>${esc(A1.name)}</h2><div class="g"><div><label>${t("fn")}<input id="f1"></label><label>${t("nat")}<input id="f2"></label><label>${t("doc")}<input id="f3"></label></div><div><label>${t("tel")}<input id="f4" type="tel"></label><label>${t("in")}<input id="f5" type="date"></label><label>${t("out")}<input id="f6" type="date"></label></div></div><label>${t("sign")}</label><canvas id="sg" width="600" height="200"></canvas><button class="s" onclick="clr()">${t("clear")}</button><p><label><input type="checkbox" id="cs" style="width:auto;margin-right:8px">${t("cons")}</label></p><button onclick="send()">${t("send")}</button></div>`);
sig();
}
function sig(){
const c=$("#sg"),x=c.getContext("2d");
let d=0;
x.lineWidth=3;x.lineCap="round";
const p=e=>{const r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return[(q.clientX-r.left)*c.width/r.width,(q.clientY-r.top)*c.height/r.height]};
const o={passive:false};
const st=e=>{e.preventDefault();d=1;SG=1;x.beginPath();x.moveTo(...p(e))};
const mv=e=>{if(!d)return;e.preventDefault();x.lineTo(...p(e));x.stroke()};
const en=()=>{d=0};
["mousedown","touchstart"].forEach(v=>c.addEventListener(v,st,o));
["mousemove","touchmove"].forEach(v=>c.addEventListener(v,mv,o));
["mouseup","mouseleave","touchend"].forEach(v=>c.addEventListener(v,en));
}
function clr(){const c=$("#sg");c.getContext("2d").clearRect(0,0,c.width,c.height);SG=0}
async function send(){
const q=i=>$("#f"+i).value.trim();
if(!q(1)||!q(3)||!q(5)||!q(6)||!SG||!$("#cs").checked)return alert(t("req"));
const now=Date.now(),r={name:q(1),nat:q(2),doc:q(3),tel:q(4),in:q(5),out:q(6),sig:$("#sg").toDataURL(),apt:GU[1],aptName:A1.name,ts:now,exp:now+H48};
await db.ref("guests/"+GU[0]).push(r);
if(EJ.service&&A1.email)emailjs.send(EJ.service,EJ.tpl,{to_email:A1.email,guest:r.name,apt:A1.name,arrival:r.in,departure:r.out,phone:r.tel}).catch(()=>{});
GR=r;thanks();
}
function thanks(){
shell(`<div class="ban">${t("ban")}</div><div class="card"><h2>${t("thanks")}</h2><button onclick="pdfF(GR,A1).save('fiche.pdf')">${t("fiche")}</button><button class="s" onclick="shareDoc(pdfF(GR,A1),'fiche.pdf')">WhatsApp</button><br><button onclick="pdfR(A1).save('reglement.pdf')">${t("rules")}</button><button class="s" onclick="shareDoc(pdfR(A1),'reglement.pdf')">WhatsApp</button></div>`);
}
function bal(g){
const m=g.members,b=m.map(()=>0);
let tot=0;
Object.values(g.exp||{}).forEach(e=>{b[e.p]+=e.a;tot+=e.a});
const sh=tot/m.length;
return{b:b.map(x=>x-sh),tot};
}
function settle(b,m){
const d=b.map((x,i)=>[i,x]).filter(x=>x[1]<-.005).sort((x,y)=>x[1]-y[1]);
const c=b.map((x,i)=>[i,x]).filter(x=>x[1]>.005).sort((x,y)=>y[1]-x[1]);
const out=[];
let i=0,j=0;
while(i<d.length&&j<c.length){
const v=Math.min(-d[i][1],c[j][1]);
out.push(`${m[d[i][0]]} → ${m[c[j][0]]} : ${v.toFixed(2)}`);
d[i][1]+=v;c[j][1]-=v;
if(d[i][1]>-.005)i++;
if(c[j][1]<.005)j++;
}
return out;
}
function trip(id){
GID=id;
const r=db.ref("groups/"+id),f=r.on("value",s=>draw(s.val()));
OFF=()=>r.off("value",f);
}
function draw(g){
if(!g)return shell('<div class="card">404</div>');
const m=g.members,E=g.exp||{},z=bal(g),b=z.b;
shell(`<div class="card"><h2>${esc(g.name)}</h2><b>${t("members")}</b><div class="g">${m.map((x,i)=>`<input value="${esc(x)}" onchange="db.ref('groups/${GID}/members/${i}').set(this.value)">`).join("")}</div></div>
<div class="card"><h2>${t("exp")}</h2><input id="xd" placeholder="${t("desc")}"><input id="xa" type="number" step="0.01" placeholder="${t("amt")}"><select id="xp">${m.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join("")}</select><button onclick="addX()">${t("add")}</button>
<table>${Object.entries(E).map(([k,e])=>`<tr><td>${esc(e.d)}</td><td>${e.a.toFixed(2)}</td><td>${esc(m[e.p])}</td><td><button class="s" onclick="editX('${k}')">✎</button><button class="s" onclick="db.ref('groups/${GID}/exp/${k}').remove()">✕</button></td></tr>`).join("")}</table></div>
<div class="card"><h2>${t("bal")}</h2><small>${t("total")}: ${z.tot.toFixed(2)}</small><table>${m.map((x,i)=>`<tr><td>${esc(x)}</td><td style="color:${b[i]<0?"#c13515":"#008a05"}"><b>${b[i].toFixed(2)}</b></td></tr>`).join("")}</table><p>${settle(b,m).map(esc).join("<br>")}</p></div>`);
}
function addX(){
const a=parseFloat($("#xa").value),d=$("#xd").value.trim();
if(!a||!d)return;
db.ref(`groups/${GID}/exp`).push({d:d,a:a,p:+$("#xp").value});
}
async function editX(k){
const r=db.ref(`groups/${GID}/exp/${k}`),e=(await r.get()).val();
const d=prompt(t("desc"),e.d),a=parseFloat(prompt(t("amt"),e.a));
if(d&&a)r.update({d:d,a:a});
}
</script>
</body>
</html>
