<style>
:root{--c1:#FF385C;--ok:#222;--info:#717171}
body{font-family:"Inter","Circular",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#222;margin:0;padding:0 20px 40px}
h2,h3,h4{color:#222}
.premium-header{background:#fff;color:#FF385C;border-radius:0;text-align:left;padding:18px 0;margin:0 0 8px;border-bottom:1px solid #ebebeb}
.premium-header h1{margin:0;font-size:22px;font-weight:800;color:#FF385C}
.premium-header p{display:none}
.card,.user-settings,.email-settings,.residence-name-setting,.custom-message-area{border-radius:20px;border:1px solid #ebebeb;box-shadow:0 6px 24px rgba(0,0,0,.07)}
.card{background:#fff}
button{background:linear-gradient(90deg,#E61E4D,#FF385C);border-radius:12px;font-weight:700;padding:12px 22px}
button.ghost{background:#fff;color:#222;border:1px solid #222}
input,select,textarea{border-radius:12px;border:1px solid #b0b0b0;width:100%;padding:12px;box-sizing:border-box;font-size:16px;font-family:inherit}
th{background:#f7f7f7;color:#222}
.hero{display:flex;flex-wrap:wrap;gap:32px;align-items:center;padding:36px 0}
.hero-text{flex:1 1 320px}
.hero h2{font-size:clamp(36px,7vw,64px);line-height:1.03;font-weight:800;letter-spacing:-1.5px;margin:0 0 16px;text-align:left}
.hero p{font-size:19px;color:#555;margin:0 0 24px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-img{flex:1 1 320px;min-height:340px;border-radius:28px;background-size:cover;background-position:center}
.sec-h{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:30px 0 14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.g-card{height:220px;border-radius:20px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.g-card span{position:absolute;left:14px;bottom:12px;background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
.pg{height:6px;background:#ebebeb;border-radius:9px;overflow:hidden;margin:6px 0 22px}
.pg i{display:block;height:100%;width:0;background:#FF385C;transition:width .3s}
.sg-count{font-size:14px;color:#717171;font-weight:600}
#sgTitle{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:0 0 8px;text-align:left}
#sgSub{color:#555;margin:0 0 18px}
.sg-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.retention{background:#FFF1F3;border:1px solid #FFC2CC;color:#8A1F33;padding:14px 16px;border-radius:14px;margin-bottom:14px;font-weight:600}
</style>
<script>
const $=id=>document.getElementById(id);
const PHOTOS={hero:'',g1:'',g2:'',g3:''};
const art=(a,b,s)=>'url("data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 420'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='600' height='420' fill='url(#g)'/>${s}</svg>`)+'")';
const ART={
hero:art('#FFE3E8','#FFC4D0',"<circle cx='470' cy='110' r='55' fill='#FFE08A'/><ellipse cx='150' cy='90' rx='70' ry='22' fill='#fff'/><ellipse cx='210' cy='105' rx='50' ry='16' fill='#fff'/><rect x='210' y='190' width='180' height='140' rx='18' fill='#FF385C'/><rect x='260' y='162' width='80' height='36' rx='10' fill='none' stroke='#222' stroke-width='10'/><rect x='240' y='190' width='12' height='140' fill='#E61E4D'/><rect x='348' y='190' width='12' height='140' fill='#E61E4D'/><rect y='330' width='600' height='90' fill='#F4D9A6'/>"),
g1:art('#FFD1A9','#FF8A8A',"<circle cx='430' cy='190' r='60' fill='#FFE08A'/><rect y='250' width='600' height='170' fill='#1AA6B7'/><path d='M0 330Q150 290 300 330T600 330V420H0Z' fill='#F4D9A6'/><path d='M130 360Q140 270 150 200' stroke='#6B4423' stroke-width='9' fill='none'/><path d='M150 200Q100 190 70 220M150 200Q200 180 230 215M150 200Q150 150 190 140M150 200Q110 150 75 150' stroke='#2E8B57' stroke-width='10' fill='none' stroke-linecap='round'/>"),
g2:art('#CFE8FF','#EAF4FF',"<circle cx='480' cy='90' r='36' fill='#fff'/><path d='M0 330L170 120L300 280L400 170L600 340V420H0Z' fill='#4A6FA5'/><path d='M170 120L130 175L170 160L200 185Z' fill='#fff'/><path d='M0 360Q300 300 600 370V420H0Z' fill='#2F5D50'/>"),
g3:art('#FFE3B3','#FFB36B',"<circle cx='300' cy='120' r='50' fill='#FFF3C4'/><rect x='60' y='230' width='140' height='190' fill='#C8553D'/><rect x='220' y='190' width='160' height='230' fill='#E07A5F'/><path d='M220 190Q300 100 380 190Z' fill='#3D5A80'/><rect x='400' y='250' width='140' height='170' fill='#C8553D'/><path d='M270 420V320Q300 280 330 320V420Z' fill='#3D2B1F'/>")
};
const bg=k=>PHOTOS[k]?`url("${PHOTOS[k]}")`:ART[k];
document.querySelector('.form-column').insertAdjacentHTML('afterbegin',`
<div id="landing">
<section class="hero">
<div class="hero-text"><h2>Enregistrez vos invités, en toute simplicité.</h2><p>Créez votre espace, partagez un lien et recevez les fiches signées de vos voyageurs.</p>
<div class="hero-cta"><button onclick="openSignup()">Créer mon espace</button><button class="ghost" onclick="openLogin()">Se connecter</button></div></div>
<div class="hero-img" style="background-image:${bg('hero')}"></div>
</section>
<div class="sec-h">Partez l'esprit léger</div>
<div class="gallery">
<div class="g-card" style="background-image:${bg('g1')}"><span>Plages</span></div>
<div class="g-card" style="background-image:${bg('g2')}"><span>Montagnes</span></div>
<div class="g-card" style="background-image:${bg('g3')}"><span>Médinas</span></div>
</div>
</div>
<div id="signupCard" class="card hidden">
<div class="sg-count" id="sgCount"></div>
<div class="pg"><i id="sgBar"></i></div>
<h3 id="sgTitle"></h3><p id="sgSub"></p>
<div id="sgField"></div>
<p id="sgErr" class="banner err hidden"></p>
<div class="sg-nav"><button type="button" class="ghost" id="sgPrev" onclick="sgPrev()">Précédent</button><button type="button" id="sgNext" onclick="sgNext()">Suivant</button></div>
<p style="text-align:center"><a href="#" onclick="showLanding(true);return false">Annuler</a></p>
</div>`);
$('userPanel').insertAdjacentHTML('afterbegin','<div class="retention">⚠️ <b>Important :</b> téléchargez les PDF ou envoyez-les par WhatsApp. Les enregistrements sont supprimés automatiquement après 48 heures.</div>');
$('loginMsg').insertAdjacentHTML('afterend','<button type="button" class="ghost" onclick="showLanding(true)">← Retour</button>');
function hideAuthUi(){['landing','loginCard','signupCard'].forEach(i=>$(i).classList.add('hidden'))}
function showLanding(v){['loginCard','signupCard'].forEach(i=>$(i).classList.add('hidden'));$('landing').classList.toggle('hidden',!v)}
function openLogin(){hideAuthUi();$('loginCard').classList.remove('hidden')}
const panels=['adminPanel','userPanel','invitePanel','readonlyPanel'].map($);
const obs=new MutationObserver(()=>{if(panels.some(p=>!p.classList.contains('hidden')))hideAuthUi()});
panels.forEach(p=>obs.observe(p,{attributes:true,attributeFilter:['class']}));
$('loginCard').classList.add('hidden');
const q0=new URLSearchParams(location.search);
if(q0.has('invite')||q0.has('readonly'))$('landing').classList.add('hidden');
const _logout=logout;
window.logout=function(e){_logout(e);showLanding(true)};
const STEPS=[
{k:'appart',t:"Quel est votre appartement ?",s:"Indiquez le numéro de votre appartement.",p:"Ex : 12"},
{k:'bat',t:"Dans quel immeuble ?",s:"Indiquez le numéro ou la lettre de l'immeuble.",p:"Ex : A"},
{k:'pass',t:"Choisissez un mot de passe",s:"Au moins 4 caractères. Il vous servira à vous connecter.",p:"Mot de passe",type:'password'},
{k:'email',t:"Où recevoir les notifications ?",s:"Adresse email qui recevra chaque nouvel enregistrement.",p:"securite@exemple.com",type:'email'},
{k:'msg',t:"Votre message pour les invités",s:"Il s'affiche après l'enregistrement de chaque invité.",p:"Bienvenue ! Voici les informations utiles pour votre séjour...",area:true}
];
let si=0;const SD={};
function openSignup(){si=0;hideAuthUi();$('signupCard').classList.remove('hidden');renderStep()}
function renderStep(){
const S=STEPS[si],last=si==STEPS.length-1;
$('sgBar').style.width=((si+1)/STEPS.length*100)+'%';
$('sgCount').textContent='Étape '+(si+1)+' sur '+STEPS.length;
$('sgTitle').textContent=S.t;$('sgSub').textContent=S.s;
$('sgField').innerHTML=S.area?`<textarea id="sgIn" rows="5" placeholder="${S.p}"></textarea>`:`<input id="sgIn" type="${S.type||'text'}" placeholder="${S.p}" autocomplete="off">`;
$('sgIn').value=SD[S.k]||'';$('sgIn').focus();
$('sgErr').classList.add('hidden');
$('sgPrev').style.visibility=si?'visible':'hidden';
$('sgNext').textContent=last?'Créer mon espace':'Suivant';
}
function sgPrev(){SD[STEPS[si].k]=$('sgIn').value.trim();si--;renderStep()}
async function sgNext(){
const S=STEPS[si],v=$('sgIn').value.trim();let e='';
if(!v)e='Ce champ est obligatoire.';
else if(S.k=='pass'&&v.length<4)e='Le mot de passe doit contenir au moins 4 caractères.';
else if(S.k=='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))e='Adresse email invalide.';
if(e){showInlineMsg('sgErr','err',e);return}
SD[S.k]=v;
if(si<STEPS.length-1){si++;renderStep();return}
await createSpace();
}
async function createSpace(){
const b=$('sgNext');b.disabled=true;b.textContent='Création...';
const id=(SD.appart+SD.bat).replace(/[\s.#$\[\]\/]/g,'');
try{
await firebase.auth().signInWithEmailAndPassword(AUTH_EMAIL,AUTH_PASS);
const ex=await database.ref('users/'+id).once('value');
if(ex.exists()){si=0;renderStep();showInlineMsg('sgErr','err','Cet appartement existe déjà dans cet immeuble. Connectez-vous ou modifiez vos informations.');return}
await database.ref('users/'+id).set({appart:SD.appart,bat:SD.bat,pass:SD.pass});
await database.ref('settings/'+id).set({maxRecords:10});
await database.ref('emailSettings/'+id).set({enableEmail:'oui',guardEmail:encrypt(SD.email)});
await database.ref('customMessages/'+id).set(SD.msg);
$('loginUser').value=id;$('loginPass').value=SD.pass;
await login();
showBanner('ok','Votre espace est créé. Identifiant de connexion : '+id);
}catch(e){showInlineMsg('sgErr','err','Erreur : '+(e.message||'création impossible'))}
finally{b.disabled=false;b.textContent='Créer mon espace'}
}
async function purgeExpired(){
const lim=Date.now()-48*3600*1000;
for(const [path,f] of [['records','timestamp'],['sentRecords','sentAt'],['history','deletedAt']]){
try{
const s=(await database.ref(path).once('value')).val()||{};
for(const id in s){
if(s[id][f]&&s[id][f]<lim){
await database.ref(path+'/'+id).remove();
if(path=='records')await database.ref('documents/'+id).remove();
}
}
}catch(e){}
}
}
['refreshAdmin','refreshUser','refreshReadonly'].forEach(n=>{
const o=window[n];
window[n]=async function(){await purgeExpired();return o.apply(this,arguments)};
});
</script>
